<!DOCTYPE html>
<html lang="ko">
<head>
    <!-- meta태그는 웹 페이지의 정보를 알려주는 태그이다. -->
    <!-- charset ="UTF-8":한글이 깨지지 않도록 문자 인코딩을 설정한다. -->
    <meta charset="UTF-8">
    <!-- name="viewport": 화면의 크기를 설정하겠다. -->
    <!--content="width=device-width":웹페이지의 가로 크기를 현재 기기의 화면 너비에 맞춰라 -->
    <!-- "initial-scale=1.0": 처음 화면을 100% 크기로 보여줘라 -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <!-- <title> </title>: 웹페이지의 타이틀-->
    <title>HTML 첫 수업</title>
</head>
<body>
    <!--타이틀 영역-->
    <div>
    <!-- <h></h>태그는 큰제목을 나타내는 태그  -->
    <h1>김원년</h1>
    <h2>김원년</h2>
    <h3>김원년</h3>
    <h4>김원년</h4>
    <h5>김원년</h5>
    <h6>김원년</h6>
    </div>
    <!-- 문장 영역 -->
    <div>
    <!--<div></div>태그는 영역을 나타내는 태그 -->
    <!-- <p> </p>태그는 문단을 나타내는 태그 -->
    <!--inline 태그-->
    <!-- <span></span>태그는 작은 단어를 나타내는 태그 -->
    <!-- <strong></strong>태그는 강조하는 태그 -->
    <!-- <b></b>태그 글자 굵게 표시하는 태그-->
    <!--<small></small> 글자를 작게 표시하는 태그  -->
    <p>Lorem ipsum, dolor sit amet consectetur adipisicing elit. <br> 
        Eum ad adipisci dicta, <br><span>maxime perspiciatis</span> veritatis 
        temporibus molestiae voluptatibus <strong>impedit accusantium </strong>odio. <br> 
        <small>obcaecati illum</small>  <b>vero</b> quam dignissimos 
        saepe suscipit aspernatur?<br></p>
    <p>html,<br>
        css,<br>  <!--<br> 줄 바꿈 태그-->
        js
    </p>
    </div>
    <!-- 이미지 태그  <img></img>-->
    <img src="https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcQi7ZSFKA2brmDYt72J8vLDQxgOJKxs-lj4tavhXo_pEA&s=10" alt="강아지">
    <img src="dog.png" alt="강아지" title="강아지">
    <img src="https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcRPbbcn9bXCW7zv2PSnTzrTQy5XwsgW8UliXnMxWeZXtQ&s=10" alt="">
    <img src="dog2.jpg" alt="강아지" title="강아지">
    <!--다른 페이지 이동 <a></a>  -->
    <!-- href: 이동할 곳의 링크 -->
    <!--target="_blank": 새로운 탭으로 열기  -->
    <!-- target="_self": 현재 탭을 해당 링크로 이동 -->
    <a href="https://www.naver.com/" target="_blank" title="네이버로 이동">네이버</a>
    <a href="https://www.google.com/" target="_self" title="구글로 이동">google</a>
    <br>
    <a href="login.html">로그인페이지</a>
    <a href="https://www.fnnews.com/"><img src="https://s.pstatic.net/static/newsstand/up/2025/0418/nsd182326399.png"></a>
</body>
</html>
